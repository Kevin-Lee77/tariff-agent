[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tariff-agent"
version = "0.1.0"
description = "Auditable customs workflow with terminology governance and expert review"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.10,<3", "pydantic-settings>=2.6,<3", "httpx>=0.27,<1", "langgraph>=1.0,<2", "langgraph-checkpoint-sqlite>=3.1,<4", "opentelemetry-sdk>=1.40,<2", "rank-bm25>=0.2.2,<1", "jieba>=0.42,<1", "numpy>=1.26,<3", "huggingface-hub>=0.34,<2", "sqlalchemy>=2.0,<3", "pwdlib[argon2]>=0.2,<1", "prometheus-client>=0.21,<1", "tokenizers>=0.23.3,<0.24"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
inference = ["torch>=2.5,<3", "transformers>=4.51,<5", "accelerate>=1,<2", "sentence-transformers>=5,<6"]
governance = ["gensim>=4.3,<5", "flask>=3.1,<4", "gunicorn>=23,<24; sys_platform != 'win32'"]
ingest = ["pypdf>=5,<7", "openpyxl>=3.1,<4", "ijson>=3.3,<4"]
training = ["peft>=0.15,<1"]
mcp = ["fastmcp>=2,<4"]
retrieval = ["qdrant-client>=1.15,<2"]
evaluation = ["agentevals>=0.0.9,<1"]
production = ["psycopg[binary]>=3.2,<4", "alembic>=1.14,<2", "supervisor>=4.2,<5", "langgraph-checkpoint-postgres>=3.2,<4", "opentelemetry-exporter-otlp-proto-http>=1.40,<2"]

[project.scripts]
tariff = "tariff_agent.cli:main"

[dependency-groups]
operations = ["sqlalchemy>=2.0,<3", "pwdlib[argon2]>=0.2,<1", "prometheus-client>=0.21,<1", "psycopg[binary]>=3.2,<4", "alembic>=1.14,<2", "supervisor>=4.2,<5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
