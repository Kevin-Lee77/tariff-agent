server {
    listen 127.0.0.1:18000;
    server_name localhost;
    client_max_body_size 4m;
    location / {
        proxy_pass http://127.0.0.1:18010;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 180s;
    }
}
