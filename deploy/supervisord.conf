[unix_http_server]
file=%(here)s/../run/supervisor.sock
chmod=0700

[supervisord]
logfile=%(here)s/../logs/supervisord.log
pidfile=%(here)s/../run/supervisord.pid
childlogdir=%(here)s/../logs

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix://%(here)s/../run/supervisor.sock

[program:tariff-api]
directory=%(here)s/..
command=%(here)s/../.venv/bin/python -m uvicorn tariff_agent.api:create_app --factory --host 127.0.0.1 --port 18000
autostart=true
autorestart=true
startsecs=3
stopwaitsecs=30
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=%(here)s/../logs/api.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=3

[program:tariff-worker]
directory=%(here)s/..
command=%(here)s/../.venv/bin/python -m tariff_agent.worker
autostart=true
autorestart=true
startsecs=3
stopwaitsecs=150
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=%(here)s/../logs/worker.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=3

[program:tax-source]
directory=%(here)s/..
command=%(here)s/../.venv/bin/gunicorn --bind 127.0.0.1:18021 --workers 1 --threads 2 --timeout 150 tariff_agent.flask_services:create_source_app()
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=%(here)s/../logs/tax-source.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=3

[program:tax-language]
directory=%(here)s/..
command=%(here)s/../.venv/bin/gunicorn --bind 127.0.0.1:18022 --workers 1 --threads 4 --timeout 150 tariff_agent.flask_services:create_language_app()
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=%(here)s/../logs/tax-language.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=3

[program:qdrant]
directory=%(here)s/..
command=%(here)s/../.venv/bin/python -m tariff_agent.qdrant_service
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=60
redirect_stderr=true
stdout_logfile=%(here)s/../logs/qdrant.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=3
