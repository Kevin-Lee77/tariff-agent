[unix_http_server]
file=%(here)s/run/supervisor.sock
chmod=0700

[supervisord]
logfile=%(here)s/logs/supervisord.log
pidfile=%(here)s/run/supervisord.pid
childlogdir=%(here)s/logs

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix://%(here)s/run/supervisor.sock

[program:gpu-gateway]
directory=%(here)s
command=%(here)s/../.venv/bin/python -m tariff_agent.gpu_gateway --root %(here)s/..
environment=HF_HUB_OFFLINE="1",TRANSFORMERS_OFFLINE="1",TOKENIZERS_PARALLELISM="false",PYTORCH_CUDA_ALLOC_CONF="expandable_segments:True"
autostart=true
autorestart=true
startsecs=30
startretries=3
stopwaitsecs=150
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=%(here)s/logs/gateway.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=3
