name: engineering-checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python scripts/check_public_release.py
      - run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.prod.lock
          .venv/bin/pip install --no-deps -e .
          .venv/bin/pip install pytest ruff pgserver==0.1.4
          .venv/bin/ruff check src/tariff_agent tests scripts migrations
          .venv/bin/python -m pytest -q
  console:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/setup-node@v4
        with: {node-version: '22',cache: npm,cache-dependency-path: frontend/package-lock.json}
      - run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.prod.lock
          .venv/bin/pip install --no-deps -e .
          cd frontend
          npm ci
          npm run build
          npx playwright install --with-deps chromium
          E2E_FIXTURES=1 E2E_BASE_URL=http://127.0.0.1:18001 E2E_CREDENTIAL_FILE=../.runtime/e2e/credentials.json npx playwright test
