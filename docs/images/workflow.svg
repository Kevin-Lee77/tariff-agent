<rect x="514" y="427" width="4" height="32" rx="2" fill="#0f766e"/>
<text x="536" y="440" font-size="13" fill="#0f766e" font-weight="700">STAGE 05 / HIERARCHY</text>
<text x="536" y="471" font-size="23" fill="#142c46" font-weight="700">子目路径解析</text>
<text x="536" y="504" font-size="18" fill="#42556e" font-weight="400">保留五 / 七 / 九位结构分组</text>
<text x="536" y="533" font-size="18" fill="#42556e" font-weight="400">每步只允许合法子节点</text>
<text x="536" y="562" font-size="18" fill="#42556e" font-weight="400">六 / 八 / 十位目标逐层完成</text>
<rect x="982" y="410" width="410" height="176" rx="16" fill="white" stroke="#d9e3ef"/>
<rect x="982" y="427" width="4" height="32" rx="2" fill="#0f766e"/>
<text x="1004" y="440" font-size="13" fill="#0f766e" font-weight="700">STAGE 06 / VERIFICATION</text>
<text x="1004" y="471" font-size="23" fill="#142c46" font-weight="700">终评与一致性校验</text>
<text x="1004" y="504" font-size="18" fill="#42556e" font-weight="400">五次采样 / 引用原文验证</text>
<text x="1004" y="533" font-size="18" fill="#42556e" font-weight="400">编码合法性 / 路径 / 证据</text>
<text x="1004" y="562" font-size="18" fill="#42556e" font-weight="400">一致率只作信号，不当概率</text>
<rect x="48" y="654" width="404" height="178" rx="16" fill="white" stroke="#d9e3ef"/>
<rect x="48" y="671" width="4" height="32" rx="2" fill="#0f766e"/>
<text x="70" y="684" font-size="13" fill="#0f766e" font-weight="700">BOUNDED EXPLORATION</text>
<text x="70" y="715" font-size="23" fill="#142c46" font-weight="700">两轮预算与工具白名单</text>
<text x="70" y="748" font-size="18" fill="#42556e" font-weight="400">plan → read_tool → plan</text>
<text x="70" y="777" font-size="18" fill="#42556e" font-weight="400">候选范围 / 只读 / 超时与去重</text>
<text x="70" y="806" font-size="18" fill="#42556e" font-weight="400">证据不足可追问，不扩散工具</text>
<rect x="514" y="654" width="406" height="178" rx="16" fill="white" stroke="#d9e3ef"/>
<rect x="514" y="671" width="4" height="32" rx="2" fill="#0f766e"/>
<text x="536" y="684" font-size="13" fill="#0f766e" font-weight="700">CONTEXT &amp; RECOVERY</text>
<text x="536" y="715" font-size="23" fill="#142c46" font-weight="700">上下文与持久执行</text>
<text x="536" y="748" font-size="18" fill="#42556e" font-weight="400">原始事实优先 / 整条证据筛选</text>
<text x="536" y="777" font-size="18" fill="#42556e" font-weight="400">超额材料卸载 / 鉴权回读</text>
<text x="536" y="806" font-size="18" fill="#42556e" font-weight="400">检查点 + 输入与知识版本</text>
<rect x="982" y="654" width="410" height="178" rx="16" fill="white" stroke="#d9e3ef"/>
<rect x="982" y="671" width="4" height="32" rx="2" fill="#0f766e"/>
<text x="1004" y="684" font-size="13" fill="#0f766e" font-weight="700">TEACHER &amp; EXPERT</text>
<text x="1004" y="715" font-size="23" fill="#142c46" font-weight="700">疑难升级与人工协同</text>
<text x="1004" y="748" font-size="18" fill="#42556e" font-weight="400">DeepSeek 结构化疑难分析</text>
<text x="1004" y="777" font-size="18" fill="#42556e" font-weight="400">缺项补充 / 专家确认与驳回</text>
<text x="1004" y="806" font-size="18" fill="#42556e" font-weight="400">审核后导出样本和发布经验</text>
<rect x="48" y="884" width="1344" height="177" rx="16" fill="#e6f4f0"/>
<text x="74" y="923" font-size="24" fill="#0f5e55" font-weight="700">一条案件的可追溯输出</text>
<text x="74" y="961" font-size="21" fill="#42556e" font-weight="400">原始输入 / 规范化版本 / 风险标注 / 属性 / 候选路径 / 引用 / 追问 / 专家决定</text>
<text x="74" y="1000" font-size="20" fill="#42556e" font-weight="400">整体十位 Top1 / Top3 为主，六位辅助；四位 Recall 只描述候选检索。</text>
<text x="74" y="1034" font-size="18" fill="#42556e" font-weight="400">阶段到达、待补充、无输出和失败均保留，不能只统计有输出样本。</text>
<text x="48" y="1110" font-size="16" fill="#6b7e94" font-weight="400">六阶段 ≠ 六次调用  /  职责分工 ≠ 独立模型进程数量</text>
</g></svg>