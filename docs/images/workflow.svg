<text x="70" y="206" font-size="13" fill="#0f766e" font-weight="700">STAGE 01 / ATTRIBUTES</text>
<text x="70" y="237" font-size="23" fill="#142c46" font-weight="700">属性抽取 Agent</text>
<text x="70" y="270" font-size="18" fill="#42556e" font-weight="400">原文 + 规范化文本 + 术语提示</text>
<text x="70" y="299" font-size="18" fill="#42556e" font-weight="400">材质 / 功能 / 用途 / 加工方式</text>
<text x="70" y="328" font-size="18" fill="#42556e" font-weight="400">Qwen 4B → 按需 DeepSeek 升级</text>
