<rect x="982" y="193" width="4" height="32" rx="2" fill="#0f766e"/>
<text x="1004" y="206" font-size="13" fill="#0f766e" font-weight="700">STAGE 03 / SHORTLIST</text>
<text x="1004" y="237" font-size="23" fill="#142c46" font-weight="700">L1 短名单与初筛</text>
<text x="1004" y="270" font-size="18" fill="#42556e" font-weight="400">Reranker + 小模型初筛</text>
<text x="1004" y="299" font-size="18" fill="#42556e" font-weight="400">当前父节点与候选白名单</text>
<text x="1004" y="328" font-size="18" fill="#42556e" font-weight="400">非法输出有界纠正 / 上限 10</text>
<rect x="48" y="410" width="404" height="176" rx="16" fill="white" stroke="#d9e3ef"/>
<rect x="48" y="427" width="4" height="32" rx="2" fill="#0f766e"/>
<text x="70" y="440" font-size="13" fill="#0f766e" font-weight="700">STAGE 04 / RULE REASONING</text>
<text x="70" y="471" font-size="23" fill="#142c46" font-weight="700">L2 章注与排他确认</text>
<text x="70" y="504" font-size="18" fill="#42556e" font-weight="400">类注 / 章注 / 排他规则</text>
<text x="70" y="533" font-size="18" fill="#42556e" font-weight="400">局部 plan → read_tool 子图</text>
<text x="70" y="562" font-size="18" fill="#42556e" font-weight="400">补充证据 / 最多 3 个候选</text>
