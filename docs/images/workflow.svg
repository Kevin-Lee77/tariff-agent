<rect x="514" y="193" width="4" height="32" rx="2" fill="#0f766e"/>
<text x="536" y="206" font-size="13" fill="#0f766e" font-weight="700">STAGE 02 / RETRIEVAL</text>
<text x="536" y="237" font-size="23" fill="#142c46" font-weight="700">候选检索 Agent</text>
<text x="536" y="270" font-size="18" fill="#42556e" font-weight="400">税则 + 历史案例双库</text>
<text x="536" y="299" font-size="18" fill="#42556e" font-weight="400">BM25 + Qwen 向量 → RRF</text>
<text x="536" y="328" font-size="18" fill="#42556e" font-weight="400">排除评测家族 / 候选上限 40</text>
